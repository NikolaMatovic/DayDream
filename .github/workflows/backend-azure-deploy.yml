name: Deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
      - daydream
    paths:
      - "_backend/**"
      - "_frontend/**"
      - ".github/workflows/backend-azure-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WEBAPP_NAME: MeineWebbApp-Nidzo
  APP_PORT: "8080"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: _frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          CI=false npm run build

      - name: Copy frontend build into backend static resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _backend/src/main/resources/static
          mkdir -p _backend/src/main/resources/static
          cp -R _frontend/build/. _backend/src/main/resources/static/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build backend JAR
        working-directory: _backend
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B clean package -DskipTests

      - name: Locate built JAR
        id: locate-jar
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH=$(find _backend/target -maxdepth 1 -type f -name "*.jar" ! -name "original-*.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No Spring Boot JAR found in _backend/target"
            exit 1
          fi
          JAR_NAME=$(basename "$JAR_PATH")
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_name=$JAR_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Web App (Publish Profile)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ steps.locate-jar.outputs.jar_path }}

      - name: Show deployed URL
        shell: bash
        run: |
          echo "Backend deployed to: https://${WEBAPP_NAME,,}.azurewebsites.net"
